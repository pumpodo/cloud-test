<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aggregatzustände Plasma</title>
<style>
@font-face{font-family:Fredoka;src:url(fonts/fredoka-latin.woff2) format('woff2');font-weight:300 700;}
html,body{margin:0;background:#2a2622;min-height:100%}
body{display:flex;align-items:center;justify-content:center;flex-direction:column;min-height:100vh}
#stage{width:min(100vw,calc((100vh - 56px)*16/9));height:auto;aspect-ratio:16/9;display:block;background:#efe4cc}
body.render #stage{width:1920px;height:1080px}
body.render #ui{display:none}
#ui{color:#e8e0d0;font:14px system-ui,sans-serif;display:flex;gap:12px;align-items:center;padding:10px 16px;box-sizing:border-box;width:100%;max-width:1200px}
#ui input{flex:1}
#ui button{font:inherit;padding:4px 12px}
text{font-family:Fredoka,'DejaVu Sans',sans-serif;font-weight:600}
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Papierstruktur für den Hintergrundbogen -->
  <filter id="bgtex" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="11" result="g"/>
    <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.18  0 0 0 0 0.1  0.6 0 0 0 -0.22" result="ga"/>
    <feComposite in="ga" in2="SourceGraphic" operator="in" result="gm"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="2" seed="5" result="big"/>
    <feColorMatrix in="big" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0 0.1  0.22 0 0 0 -0.08" result="bga"/>
    <feComposite in="bga" in2="SourceGraphic" operator="in" result="bgm"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="bgm"/><feMergeNode in="gm"/></feMerge>
  </filter>
  <!-- Ausgeschnittenes Papier: unruhige Kante, Körnung, Schlagschatten -->
  <filter id="paper" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="2" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8" result="g"/>
    <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.15  0 0 0 0 0.1  0.7 0 0 0 -0.27" result="ga"/>
    <feComposite in="ga" in2="d" operator="in" result="gm"/>
    <feMerge result="m"><feMergeNode in="d"/><feMergeNode in="gm"/></feMerge>
    <feDropShadow in="m" dx="4" dy="7" stdDeviation="4" flood-color="#3a2614" flood-opacity="0.38"/>
  </filter>
  <!-- Gleicher Look für bildbreite Teile (kleinerer Filterbereich) -->
  <filter id="paperW" x="-3%" y="-12%" width="106%" height="130%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="9" result="g"/>
    <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.15  0 0 0 0 0.1  0.7 0 0 0 -0.27" result="ga"/>
    <feComposite in="ga" in2="d" operator="in" result="gm"/>
    <feMerge result="m"><feMergeNode in="d"/><feMergeNode in="gm"/></feMerge>
    <feDropShadow in="m" dx="0" dy="-6" stdDeviation="5" flood-color="#3a2614" flood-opacity="0.3"/>
  </filter>
</defs>
<g id="root"></g>
</svg>
<div id="ui">
  <button id="play">Pause</button>
  <input id="scrub" type="range" min="0" step="0.01" value="0">
  <span id="tc">0.0 s</span>
</div>

<script>
// =====================================================================
//  ZEITPLAN – hier an die Sprachaufnahme anpassen (Sekunden)
// =====================================================================
const SCENES = {
  titel:      [0, 4],    // "Was ist jetzt Kaltplasma?"
  zustaende:  [4, 22],   // "Du kennst fest, flüssig und gasförmig. Plasma ist der vierte ... Ein Blitz ist zum Beispiel Plasma."
  kalt:       [22, 34],  // "Beim Kaltplasma sind nur die Elektronen energiegeladen, das Gas selbst bleibt kühl ..."
  pointe:     [34, 42],  // "Ich sag mal so: ein kleiner, elektrisch angeregter Gasstrahl, der nichts verbrennt."
};
const DURATION = 42;
const STOP_FPS = 12;   // Stop-Motion-Takt (Bilder pro Sekunde)

// ---------------------------------------------------------------------
const NS = 'http://www.w3.org/2000/svg';
const root = document.getElementById('root');
const C = {
  ink:'#3B2F2F', white:'#FFFDF7', cream:'#F4EAD5',
  plasma1:'#6C4FD1', plasma2:'#9B84EE', plasma3:'#D6CCFA',
  device:'#5B7A99', device2:'#3F5A75', yellow:'#F2C14E',
  teal:'#2F7F7B', red:'#D5524A', skin1:'#F3C9AE', skin2:'#E9AE90', skin3:'#F1D68E',
};

const clamp = (v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const prog  = (t,a,b)=>clamp((t-a)/(b-a));
const lerp  = (a,b,p)=>a+(b-a)*p;
const easeOut   = p=>1-Math.pow(1-p,3);
const easeIn    = p=>p*p*p;
const easeInOut = p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const backOut   = p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
function hash(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);}

function el(tag,attrs={},parent){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
let JID=1, JT=0;
// Ein "Papierstück": bekommt Papierfilter und eigenes Stop-Motion-Zittern
function piece(parent,filter='paper'){
  const g=el('g',filter?{filter:`url(#${filter})`}:{},parent);
  g.dataset.jid=JID++;
  return g;
}
// Positionieren mit leichtem Zittern wie bei gelegtem Papier
function place(e,x,y,r=0,sx=1,sy=sx){
  const id=+e.dataset.jid||0, f=JT;
  const jx=(hash(id*13.1+f)-.5)*2.2, jy=(hash(id*7.3+f*3.7)-.5)*2.2, jr=(hash(id*3.9+f*11.3)-.5)*1.1;
  e.setAttribute('transform',`translate(${(x+jx).toFixed(2)},${(y+jy).toFixed(2)}) rotate(${(r+jr).toFixed(2)}) scale(${sx.toFixed(4)},${sy.toFixed(4)})`);
}
function show(e,v){e.setAttribute('display',v?'inline':'none');}
function pop(e,x,y,lt,t0,rot=0,dur=0.45){
  const p=prog(lt,t0,t0+dur); show(e,p>0);
  if(p>0) place(e,x,y,rot,Math.max(0.001,backOut(p)));
}
function slideIn(e,x,y,lt,t0,fromX,rot=0,dur=0.6){
  const p=prog(lt,t0,t0+dur); show(e,p>0);
  if(p>0) place(e,lerp(fromX,x,backOut(p)),y,rot);
}

// ---------- Bausteine ----------
function tag(parent,text,{size=40,fill=C.white,color=C.ink,pad=26,hole=false,filter='paper'}={}){
  const g=piece(parent,filter);
  const r=el('rect',{fill,rx:12},g);
  const tx=el('text',{'font-size':size,fill:color,'text-anchor':'middle',y:size*0.35},g);
  tx.textContent=text;
  const extra=hole?34:0;
  const w=tx.getComputedTextLength()+pad*2+extra, h=size*1.65;
  r.setAttribute('x',-w/2); r.setAttribute('y',-h/2); r.setAttribute('width',w); r.setAttribute('height',h);
  if(hole){ tx.setAttribute('x',extra/2); el('circle',{cx:-w/2+24,cy:0,r:8,fill:C.ink,opacity:.55},g); }
  g.w=w; g.h=h; return g;
}
function header(parent,num,label,color){
  const badge=piece(parent);
  el('circle',{r:58,fill:color},badge);
  const n=el('text',{y:23,'text-anchor':'middle','font-size':68,fill:C.white},badge); n.textContent=num;
  const ban=tag(parent,label,{size:56,pad:34});
  return {badge,ban};
}
function animHeader(h,lt){
  pop(h.badge,150,140,lt,0.5);
  slideIn(h.ban,240+h.ban.w/2,142,lt,0.8,-900,-1.5);
}
function star(parent,color,r=40){
  const g=piece(parent); let d='';
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*0.45:r; d+=(i?'L':'M')+(Math.cos(a)*rr).toFixed(1)+','+(Math.sin(a)*rr).toFixed(1);}
  el('path',{d:d+'Z',fill:color},g); return g;
}

// Kaltplasma-Handstück; Spitze liegt im Ursprung und zeigt nach +x
function makeDevice(parent){
  const g=el('g',{},parent); g.dataset.jid=JID++;
  const jet=[];
  [[C.plasma3,270,30],[C.plasma2,205,21],['#F4F0FF',130,11]].forEach(([col,L,h])=>{
    const j=piece(g);
    el('path',{d:`M0,${-h} Q${L*0.45},${-h*1.25} ${L},0 Q${L*0.45},${h*1.25} 0,${h} Z`,fill:col},j);
    jet.push(j);
  });
  const body=piece(g);
  el('path',{d:'M-560,40 C-640,60 -700,20 -760,70',stroke:'#2E3B47','stroke-width':16,fill:'none','stroke-linecap':'round'},body);
  el('rect',{x:-580,y:-46,width:520,height:92,rx:42,fill:C.device},body);
  el('rect',{x:-430,y:-46,width:90,height:92,fill:C.device2},body);
  el('path',{d:'M-62,-32 L0,-15 L0,15 L-62,32 Z',fill:C.device2},body);
  el('circle',{cx:-250,cy:-12,r:15,fill:C.yellow},body);
  el('rect',{x:-560,y:-34,width:110,height:14,rx:7,fill:'#fff',opacity:.35},body);
  return {g,jet};
}
function updDevice(d,x,y,ang,on,f,len=1){
  place(d.g,x,y,ang);
  d.jet.forEach((j,i)=>{
    if(on<0.03){show(j,false);return;}
    show(j,true);
    const sx=on*len*(0.82+0.32*hash(f*5.1+i*17)), sy=0.85+0.3*hash(f*9.7+i*3);
    j.setAttribute('transform',`scale(${sx.toFixed(3)},${sy.toFixed(3)})`);
  });
}

// Gesichter: 0 froh, 1 besorgt, 2 erschrocken, 3 k.o., 4 nachdenklich
function makeFace(parent,r){
  const f={r};
  f.eyes=[-1,1].map(s=>{
    const g=el('g',{transform:`translate(${s*r*0.36},${-r*0.12})`},parent);
    const w=el('ellipse',{rx:r*0.17,ry:r*0.21,fill:'#fff'},g);
    const p=el('circle',{r:r*0.09,fill:C.ink},g);
    const x=el('path',{d:`M${-r*.12},${-r*.12}L${r*.12},${r*.12}M${r*.12},${-r*.12}L${-r*.12},${r*.12}`,stroke:C.ink,'stroke-width':r*0.08,'stroke-linecap':'round'},g);
    return {w,p,x};
  });
  f.brows=[0,1].map(()=>el('path',{stroke:C.ink,'stroke-width':r*0.065,'stroke-linecap':'round',fill:'none'},parent));
  f.mouth=el('path',{stroke:C.ink,'stroke-width':r*0.075,'stroke-linecap':'round','stroke-linejoin':'round'},parent);
  f.sweat=el('path',{d:`M${r*0.78},${-r*0.62} q${r*0.13},${r*0.26} 0,${r*0.32} q${-r*0.13},${-r*0.06} 0,${-r*0.32}z`,fill:'#9FD3F0'},parent);
  setFace(f,0);
  return f;
}
function setFace(f,mood,look=0){
  const r=f.r, ko=mood===3;
  f.eyes.forEach(e=>{
    show(e.w,!ko); show(e.p,!ko); show(e.x,ko);
    const big=mood===2?1.3:1;
    e.w.setAttribute('rx',r*0.17*big); e.w.setAttribute('ry',r*0.21*big);
    e.p.setAttribute('cx',look*r*0.07); e.p.setAttribute('r',r*(mood===2?0.065:0.09));
  });
  f.brows.forEach((b,i)=>{
    const s=i?1:-1, x=s*r*0.36, y=-r*0.5, inner=x-s*r*0.14, outer=x+s*r*0.14;
    let d='M0,0';
    if(mood===0) d=`M${inner},${y+r*.03}Q${x},${y-r*.07} ${outer},${y+r*.03}`;
    else if(mood===1||mood===2) d=`M${inner},${y-r*.12}L${outer},${y+r*.01}`;
    else if(mood===4) d=i?`M${inner},${y-r*.04}Q${x},${y-r*.2} ${outer},${y-r*.1}`:`M${inner},${y}L${outer},${y}`;
    b.setAttribute('d',d); show(b,!ko);
  });
  let m, fill='none';
  if(mood===0) m=`M${-r*.26},${r*.24}Q0,${r*.52} ${r*.26},${r*.24}`;
  else if(mood===1) m=`M${-r*.24},${r*.4}q${r*.12},${-r*.11} ${r*.24},0 t${r*.24},0`;
  else if(mood===2){ m=`M${-r*.1},${r*.38}a${r*.1},${r*.14} 0 1,0 ${r*.2},0a${r*.1},${r*.14} 0 1,0 ${-r*.2},0`; fill=C.ink; }
  else if(mood===3) m=`M${-r*.24},${r*.38}q${r*.12},${r*.1} ${r*.24},0 t${r*.24},0`;
  else m=`M${-r*.18},${r*.38}L${r*.16},${r*.33}`;
  f.mouth.setAttribute('d',m); f.mouth.setAttribute('fill',fill);
  show(f.sweat,mood===1||mood===2);
}

// ---------- Szenen ----------
const scenes=[];
function makeScene(key,bg,builder){
  const [s,e]=SCENES[key];
  const g=el('g',{},root);
  el('rect',{x:-60,y:-60,width:2040,height:1200,fill:bg,filter:'url(#bgtex)'},g);
  const upd=builder(g);
  scenes.push({key,s,e,g,upd});
}

// Dreieckswelle 0..1 -> Teilchen prallen an den Wänden ab
const tri=u=>1-Math.abs(((u%2)+2)%2-1);
function bounce(t,i,vx,vy,x0,x1,y0,y1){
  return [lerp(x0,x1,tri(t*vx/(x1-x0)+hash(i*3.3))), lerp(y0,y1,tri(t*vy/(y1-y0)+hash(i*7.7)))];
}
// Teilchen mit kleinem Gesicht: sleep, happy, wild
function particle(parent,r,col,mood,sign){
  const p=el('g',{},parent);
  el('circle',{r,fill:col},p);
  el('ellipse',{cx:-r*.35,cy:-r*.4,rx:r*.28,ry:r*.13,fill:'#fff',opacity:.4},p);
  const sw={stroke:C.ink,'stroke-width':Math.max(2,r*.1),fill:'none','stroke-linecap':'round'};
  if(mood==='sleep'){
    [-1,1].forEach(s=>el('path',{d:`M${s*r*.32-r*.13},${-r*.05} q${r*.13},${r*.12} ${r*.26},0`,...sw},p));
    el('path',{d:`M${-r*.12},${r*.32} q${r*.12},${r*.1} ${r*.24},0`,...sw},p);
  } else if(mood==='happy'){
    [-1,1].forEach(s=>el('circle',{cx:s*r*.32,cy:-r*.06,r:r*.11,fill:C.ink},p));
    el('path',{d:`M${-r*.25},${r*.22} q${r*.25},${r*.28} ${r*.5},0`,...sw},p);
  } else if(mood==='wild'){
    [-1,1].forEach(s=>{el('circle',{cx:s*r*.33,cy:-r*.1,r:r*.2,fill:'#fff'},p); el('circle',{cx:s*r*.33+r*.05,cy:-r*.1,r:r*.1,fill:C.ink},p);});
    el('ellipse',{cx:0,cy:r*.38,rx:r*.14,ry:r*.17,fill:C.ink},p);
  }
  if(sign&&mood){const b=el('g',{transform:`translate(${r*.72},${-r*.72})`},p); el('circle',{r:r*.42,fill:'#fff'},b);
    const t=el('text',{y:r*.17,'text-anchor':'middle','font-size':r*.62,fill:C.plasma1},b); t.textContent=sign;}
  else if(sign){const t=el('text',{y:r*.38,'text-anchor':'middle','font-size':r*1.25,fill:C.ink},p); t.textContent=sign;}
  return p;
}
function iceIcon(g){const p=piece(g); el('rect',{x:-40,y:-40,width:80,height:80,rx:14,fill:'#BFE3F5'},p); el('rect',{x:-26,y:-28,width:22,height:10,rx:5,fill:'#fff',opacity:.8},p); return p;}
function dropIcon(g){const p=piece(g); el('path',{d:'M0,-48 C22,-18 36,2 36,20 A36,36 0 0 1 -36,20 C-36,2 -22,-18 0,-48 Z',fill:'#4F9BD6'},p); el('ellipse',{cx:-14,cy:12,rx:8,ry:14,fill:'#fff',opacity:.6},p); return p;}
function cloudIcon(g,col='#DCE8F2',s=1){const p=piece(g); [[-34,8,30],[0,-10,40],[38,6,30],[0,18,30]].forEach(([x,y,r])=>el('circle',{cx:x*s,cy:y*s,r:r*s,fill:col},p)); return p;}
function boltIcon(g,s=1){const p=piece(g); el('path',{d:`M${12*s},${-50*s} L${-24*s},${6*s} L${0},${6*s} L${-12*s},${50*s} L${26*s},${-8*s} L${2*s},${-8*s} Z`,fill:C.yellow,stroke:'#C99A1E','stroke-width':3},p); return p;}

// Glühen für die Plasma-Box
(function(){const defs=document.querySelector('defs');
  const rg=el('radialGradient',{id:'glow'},defs);
  el('stop',{offset:'0%','stop-color':'#C9B8FF','stop-opacity':'0.9'},rg);
  el('stop',{offset:'100%','stop-color':'#C9B8FF','stop-opacity':'0'},rg);})();

// ===== Szene 0: Titel =====
function sceneTitel(g){
  const b1=tag(g,'Was ist',{size:92,pad:44});
  const b2=tag(g,'Kaltplasma?',{size:120,pad:50,fill:C.plasma1,color:C.white});
  const icons=[iceIcon(g),dropIcon(g),cloudIcon(g),boltIcon(g)];
  const arrows=[0,1,2].map(()=>{const p=piece(g); el('path',{d:'M-22,-10 L8,-10 L8,-24 L30,0 L8,24 L8,10 L-22,10 Z',fill:'#C9B79A'},p); return p;});
  return (lt,f)=>{
    slideIn(b1,800,330,lt,0.2,-900,-2);
    slideIn(b2,1010,500,lt,0.55,2700,2);
    icons.forEach((ic,i)=>pop(ic,560+i*270,800+(i%2?-10:10),lt,1.4+i*0.4,(i-1.5)*6));
    arrows.forEach((a,i)=>pop(a,695+i*270,800,lt,1.6+i*0.4,0));
  };
}

// ===== Szene 1: Aggregatzustände + Plasma =====
function sceneZustaende(g){
  const X=[300,740,1180,1620], CY=560, IX=148, IY=168;
  const hd=tag(g,'Aggregatzustände',{size:56,pad:34});
  const cols=['#5FA8D3','#3E86C6','#8BB8DB',C.plasma1];
  const names=['fest','flüssig','gasförmig','Plasma'];
  const glow=el('circle',{r:300,fill:'url(#glow)'},g);
  const boxes=X.map((x,i)=>{
    const box=piece(g);
    el('rect',{x:-180,y:-200,width:360,height:400,rx:24,fill:'#FFFDF7'},box);
    el('rect',{x:-180,y:-200,width:360,height:400,rx:24,fill:'none',stroke:cols[i],'stroke-width':10},box);
    return box;});
  const labels=names.map((n,i)=>tag(g,n,{size:48,fill:cols[i],color:'#fff'}));
  const four=piece(g); el('circle',{r:44,fill:C.yellow},four); const ft=el('text',{y:17,'text-anchor':'middle','font-size':50,fill:C.ink},four); ft.textContent='4.';
  // Teilchen
  const pf=piece(g), pl=piece(g), pg=piece(g), pp=piece(g);
  const fest=[]; for(let r=0;r<4;r++)for(let c=0;c<4;c++) fest.push({e:particle(pf,27,'#8CC4E6','sleep'),x:-99+c*66,y:-40+r*66});
  const water=el('path',{fill:'#CFE6F7'},pl);
  const fl=[]; for(let i=0;i<13;i++) fl.push(particle(pl,26,'#4F9BD6','happy'));
  const gas=[]; for(let i=0;i<8;i++) gas.push(particle(pg,25,'#A9D0EC','wild'));
  const ions=[]; for(let i=0;i<6;i++) ions.push(particle(pp,28,'#9B84EE','wild','+'));
  const elec=[]; for(let i=0;i<9;i++) elec.push(particle(pp,12,C.yellow,null,'−'));
  // Energiepfeil
  const arrow=piece(g);
  el('path',{d:'M0,-34 L1560,-34 L1560,-62 L1660,0 L1560,62 L1560,34 L0,34 Z',fill:'url(#energy)'},arrow);
  const defs=document.querySelector('defs'); const lg=el('linearGradient',{id:'energy'},defs);
  [['0%','#8CC4E6'],['55%','#F2A65A'],['80%','#E0574F'],['100%',C.plasma1]].forEach(([o,c])=>el('stop',{offset:o,'stop-color':c},lg));
  const en=tag(g,'immer mehr Energie',{size:40});
  const tCh=tag(g,'elektrisch geladene Teilchen',{size:38,fill:C.yellow});
  const cloud=cloudIcon(g,'#9AA9B8',1.5), bolt=boltIcon(g,2.1);
  const tBlitz=tag(g,'z. B. Blitz',{size:42});
  const flash=el('rect',{x:-60,y:-60,width:2040,height:1200,fill:'#fff'},g);
  return (lt,f)=>{
    slideIn(hd,120+hd.w/2,140,lt,0.3,-900,-1.5);
    const show4=lt>=5.4;
    boxes.forEach((b,i)=>pop(b,X[i],CY,lt,[0.8,2.0,3.2,5.4][i],(i%2?1:-1)*1.2));
    labels.forEach((l,i)=>pop(l,X[i],300,lt,[1.0,2.2,3.4,5.6][i],(i%2?-2:2)));
    pop(four,X[3]-170,CY-190,lt,6.4,-12);
    // Pfeil wächst mit
    const ap=easeOut(prog(lt,1.0,6.0)); show(arrow,ap>0.01); if(ap>0.01) place(arrow,90,850,0,ap,1);
    pop(en,520,850,lt,2.4,-1);
    // fest: zittern auf der Stelle
    const vf=prog(lt,0.9,1.3); show(pf,vf>0); if(vf>0){place(pf,X[0],CY,-1.2,backOut(vf));
      fest.forEach((o,i)=>o.e.setAttribute('transform',`translate(${(o.x+Math.sin(lt*22+i*1.7)*2.5).toFixed(1)},${(o.y+Math.cos(lt*19+i)*2.5).toFixed(1)})`));}
    // flüssig: lose, gleitet am Boden
    const vl=prog(lt,2.1,2.5); show(pl,vl>0); if(vl>0){place(pl,X[1],CY,1.2,backOut(vl));
      let d='M-170,-10'; for(let x=-170;x<170;x+=34) d+=` q17,${Math.sin(lt*3+x)*8} 34,0`;
      water.setAttribute('d',d+' L170,190 L-170,190 Z');
      fl.forEach((e,i)=>{const bx=-120+(i%5)*60, by=40+Math.floor(i/5)*55;
        e.setAttribute('transform',`translate(${(bx+Math.sin(lt*1.4+i*2.1)*26).toFixed(1)},${(by+Math.cos(lt*1.1+i*1.3)*12).toFixed(1)})`);});}
    // gasförmig: fliegt schnell herum
    const vg=prog(lt,3.3,3.7); show(pg,vg>0); if(vg>0){place(pg,X[2],CY,-1.2,backOut(vg));
      gas.forEach((e,i)=>{const [x,y]=bounce(lt,i,260+hash(i)*120,220+hash(i+9)*140,-IX+6,IX-6,-IY+6,IY-6); e.setAttribute('transform',`translate(${x.toFixed(1)},${y.toFixed(1)})`);});}
    // Plasma: Gas, das sich in Ionen und Elektronen aufteilt
    const vp=prog(lt,5.5,5.9); show(pp,vp>0); show(glow,vp>0);
    if(vp>0){place(pp,X[3],CY,1.2,backOut(vp));
      glow.setAttribute('transform',`translate(${X[3]},${CY})`); glow.setAttribute('opacity',(0.55+0.35*hash(f*3.1)).toFixed(2));
      const split=easeInOut(prog(lt,7.6,8.6));
      ions.forEach((e,i)=>{const [x,y]=bounce(lt,i,300+hash(i)*100,260+hash(i+5)*120,-IX+6,IX-6,-IY+6,IY-6); e.setAttribute('transform',`translate(${x.toFixed(1)},${y.toFixed(1)})`); e.ix=x; e.iy=y;});
      elec.forEach((e,i)=>{const host=ions[i%6]; const [x,y]=bounce(lt,i+20,900+hash(i)*300,800+hash(i+2)*300,-IX+10,IX-10,-IY+10,IY-10);
        const ax=host.ix+22, ay=host.iy-22;
        e.setAttribute('transform',`translate(${lerp(ax,x,split).toFixed(1)},${lerp(ay,y,split).toFixed(1)})`);
        show(e,split>0||i<6);});
    }
    pop(tCh,X[3]-40,975,lt,8.4,-2);
    // Blitz
    pop(cloud,1800,120,lt,11.6,0,0.4);
    pop(tBlitz,1500,120,lt,12.2,-3);
    const bOn=lt>12.3&&lt<14.2&&hash(f*1.7)>0.25; show(bolt,bOn); if(bOn) place(bolt,1782,250,10,1);
    const fl2=lt>12.3&&lt<12.7; show(flash,fl2); if(fl2) flash.setAttribute('opacity',(0.35+0.3*hash(f)).toFixed(2));
  };
}

// ===== Szene 2: Kaltplasma – nur die Elektronen sind heiß =====
function sceneKalt(g){
  const BX=790, BY=600, HW=540, HH=290;
  const hd=tag(g,'Kaltplasma',{size:60,pad:36,fill:C.plasma1,color:'#fff'});
  const box=piece(g);
  el('rect',{x:-HW-20,y:-HH-20,width:2*HW+40,height:2*HH+40,rx:30,fill:'#FFFDF7'},box);
  el('rect',{x:-HW-20,y:-HH-20,width:2*HW+40,height:2*HH+40,rx:30,fill:'none',stroke:C.plasma2,'stroke-width':12},box);
  const parts=piece(g);
  const gas=[]; for(let i=0;i<11;i++) gas.push(particle(parts,38,'#A9D0EC',i%3?'happy':'sleep'));
  const trails=[], elec=[];
  for(let i=0;i<15;i++){ trails.push(el('line',{stroke:'#F6D77A','stroke-width':8,'stroke-linecap':'round',opacity:.7},parts)); }
  for(let i=0;i<15;i++) elec.push(particle(parts,13,C.yellow,null,'−'));
  function thermo(){const p=piece(g);
    el('rect',{x:-30,y:-260,width:60,height:470,rx:30,fill:'#FFFDF7',stroke:'#B9A98F','stroke-width':6},p);
    el('circle',{cy:240,r:56,fill:'#FFFDF7',stroke:'#B9A98F','stroke-width':6},p);
    const lvl=el('rect',{x:-16,width:32,rx:16},p); const bulb=el('circle',{cy:240,r:42},p);
    for(let k=0;k<6;k++) el('line',{x1:30,x2:52,y1:-200+k*70,y2:-200+k*70,stroke:'#B9A98F','stroke-width':5},p);
    return {p,lvl,bulb};}
  const tE=thermo(), tG=thermo();
  const lE=tag(g,'Elektronen',{size:38,fill:C.yellow}), lG=tag(g,'Gas',{size:38,fill:'#A9D0EC'});
  const sE=tag(g,'energiegeladen',{size:36}), sG=tag(g,'ca. körperwarm',{size:36});
  const flame=piece(g); el('path',{d:'M0,-44 C24,-16 30,6 0,34 C-30,6 -24,-16 0,-44Z',fill:'#F08A3C'},flame); el('path',{d:'M0,-18 C10,-4 12,8 0,20 C-12,8 -10,-4 0,-18Z',fill:C.yellow},flame);
  const snow=piece(g); for(let k=0;k<3;k++) el('rect',{x:-5,y:-34,width:10,height:68,rx:5,fill:'#6FB0E8',transform:`rotate(${k*60})`},snow);
  const setT=(t,lv,col)=>{const top=200-lv*440; t.lvl.setAttribute('y',top); t.lvl.setAttribute('height',260-top); t.lvl.setAttribute('fill',col); t.bulb.setAttribute('fill',col);};
  return (lt,f)=>{
    slideIn(hd,120+hd.w/2,140,lt,0.3,-900,-1.5);
    pop(box,BX,BY,lt,0.6,-0.8,0.5);
    const vp=prog(lt,0.8,1.2); show(parts,vp>0);
    if(vp>0){ place(parts,BX,BY,-0.8,backOut(vp));
      gas.forEach((e,i)=>{const [x,y]=bounce(lt,i,40+hash(i)*30,34+hash(i+4)*30,-HW+40,HW-40,-HH+40,HH-40); e.setAttribute('transform',`translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(Math.sin(lt+i)*8).toFixed(1)})`);});
      const eo=prog(lt,2.0,2.4);
      elec.forEach((e,i)=>{const sp=[1100+hash(i)*500,950+hash(i+3)*450];
        const [x,y]=bounce(lt,i+40,sp[0],sp[1],-HW+14,HW-14,-HH+14,HH-14);
        const [px,py]=bounce(lt-0.035,i+40,sp[0],sp[1],-HW+14,HW-14,-HH+14,HH-14);
        show(e,eo>0); show(trails[i],eo>0);
        e.setAttribute('transform',`translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${eo.toFixed(2)})`);
        trails[i].setAttribute('x1',px.toFixed(1)); trails[i].setAttribute('y1',py.toFixed(1)); trails[i].setAttribute('x2',x.toFixed(1)); trails[i].setAttribute('y2',y.toFixed(1));});
    }
    pop(tE.p,1520,560,lt,2.6,0,0.4); pop(tG.p,1760,560,lt,2.8,0,0.4);
    setT(tE,lerp(0.08,0.95,easeOut(prog(lt,3.2,5.0))),'#E0574F');
    setT(tG,lerp(0.08,0.38,easeOut(prog(lt,6.8,8.2))),'#6FB0E8');
    pop(lE,1520,940,lt,2.9,-2); pop(lG,1760,940,lt,3.1,2);
    pop(sE,1520,250,lt,4.6,-2); pop(sG,1760,330,lt,8.3,2);
    const fo=lt>4.8; show(flame,fo); if(fo) place(flame,1610,370,0,0.9+0.2*hash(f));
    pop(snow,1840,560,lt,8.6,lt*20,0.4);
  };
}

// ===== Szene 3: Pointe – Gasstrahl, der nichts verbrennt =====
function scenePointe(g){
  const dev=makeDevice(g);
  const foot=piece(g);
  el('path',{d:'M-78,-110 C-120,-50 -112,70 -84,150 C-62,215 60,215 80,150 C104,70 118,-50 86,-112 C62,-160 -50,-160 -78,-110 Z',fill:C.skin1},foot);
  [[-50,-168,34],[6,-186,24],[48,-178,20],[82,-160,17],[106,-134,14]].forEach(([x,y,r])=>el('circle',{cx:x,cy:y,r,fill:C.skin1},foot));
  [[-50,-176,13],[6,-192,9],[48,-184,8]].forEach(([x,y,r])=>el('ellipse',{cx:x,cy:y,rx:r,ry:r*0.75,fill:'#FBE3D3'},foot));
  el('ellipse',{cx:-62,cy:30,rx:14,ry:9,fill:'#F2A7A0',opacity:.7},foot); el('ellipse',{cx:62,cy:30,rx:14,ry:9,fill:'#F2A7A0',opacity:.7},foot);
  const face=makeFace(el('g',{transform:'translate(0,0)'},foot),62);
  const sparks=[0,1,2].map(i=>star(g,i%2?C.yellow:'#fff',i%2?30:22));
  const t1=tag(g,'verbrennt nichts',{size:46,fill:C.yellow});
  const ban=tag(g,'ein kleiner, elektrisch angeregter Gasstrahl',{size:54,pad:40});
  return (lt,f)=>{
    const dp=easeOut(prog(lt,0.2,1.2));
    const on=prog(lt,2.6,3.0);
    updDevice(dev,lerp(-300,820,dp),540,0,on,f,1.8);
    let mood=0;
    if(lt>1.0&&lt<3.4) mood=lt<2.6?1:2;
    else if(lt>=3.4) mood=0;
    setFace(face,mood,mood?-1:0);
    const shake=(mood===1||mood===2)?(hash(f*5)-.5)*6:0;
    const relax=lt>3.4?Math.sin((lt-3.4)*3)*2:0;
    pop(foot,1370+shake,560,lt,0.3,-4+relax,0.5);
    sparks.forEach((s,i)=>{const p=prog(lt,3.6+i*0.25,4.4+i*0.25); show(s,p>0&&p<1);
      if(p>0&&p<1) place(s,1250+i*60,420-i*40-p*60,p*90,backOut(clamp(p*2.5))*(1-p*0.4));});
    pop(t1,1370,850,lt,4.2,-2);
    pop(ban,960,150,lt,5.4,-1);
  };
}

// ---------- Aufbau & Wiedergabe ----------
function renderAt(t){
  const f=Math.floor(t*STOP_FPS+1e-6); t=f/STOP_FPS;
  JT=Math.floor(t*4);
  scenes.forEach((sc,i)=>{
    const last=i===scenes.length-1;
    const vis=t>=sc.s&&(last||t<sc.e+0.8);
    show(sc.g,vis); if(!vis) return;
    const lt=t-sc.s;
    if(i>0){const p=prog(lt,0,0.7); sc.g.setAttribute('transform',`translate(0,${lerp(1200,0,backOut(p)).toFixed(1)}) rotate(${lerp(4,0,p).toFixed(2)} 960 540)`);}
    sc.upd(lt,f);
  });
}

async function init(){
  await document.fonts.load('600 40px Fredoka');
  await document.fonts.ready;
  makeScene('titel','#F4EAD5',sceneTitel);
  makeScene('zustaende','#E6EEF4',sceneZustaende);
  makeScene('kalt','#EEE8F6',sceneKalt);
  makeScene('pointe','#F4EAD5',scenePointe);
  window.renderAt=renderAt; window.DURATION=DURATION; window.STOP_FPS=STOP_FPS;
  const isRender=new URLSearchParams(location.search).has('render');
  if(isRender){document.body.classList.add('render'); renderAt(0); window.READY=true; return;}
  const scrub=document.getElementById('scrub'), tc=document.getElementById('tc'), btn=document.getElementById('play');
  scrub.max=DURATION; let playing=true, t0=performance.now(), cur=0;
  btn.onclick=()=>{playing=!playing; btn.textContent=playing?'Pause':'Play'; t0=performance.now()-cur*1000;};
  scrub.oninput=()=>{cur=+scrub.value; t0=performance.now()-cur*1000; renderAt(cur); tc.textContent=cur.toFixed(1)+' s';};
  (function loop(){ if(playing){cur=((performance.now()-t0)/1000)%DURATION; scrub.value=cur; tc.textContent=cur.toFixed(1)+' s'; renderAt(cur);} requestAnimationFrame(loop); })();
  window.READY=true;
}
init();
</script>
